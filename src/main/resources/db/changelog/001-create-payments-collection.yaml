databaseChangeLog:
  - changeSet:
      id: create-payments-collection
      author: egor
      changes:
        - createCollection:
            collectionName: payments
            options:
              validator:
                $jsonSchema:
                  bsonType: object
                  required:
                    - order_id
                    - user_id
                    - status
                    - timestamp
                    - payment_amount
                  properties:
                    _id:
                      bsonType: string
                      description: "UUID для идемпотентности"
                    order_id:
                      bsonType: string
                      description: "Идентификатор заказа"
                    user_id:
                      bsonType: string
                      description: "Идентификатор пользователя"
                    status:
                      enum: ["PENDING", "SUCCESS", "FAILED"]
                      description: "Статус платежа"
                    timestamp:
                      bsonType: date
                      description: "Дата/время платежа"
                    payment_amount:
                      bsonType: double
                      minimum: 0
                      description: "Сумма платежа"

  - changeSet:
      id: payments-index-order-id
      author: egor
      changes:
        - createIndex:
            collectionName: payments
            keys:
              order_id: 1
            options:
              unique: true

  - changeSet:
      id: payments-index-user-timestamp
      author: egor
      changes:
        - createIndex:
            collectionName: payments
            keys:
              user_id: 1
              timestamp: -1
